[package]
name = "ssg"
version = "0.1.0"
edition = "2021"
description = "Static site generator using Typst as markup language"

[[bin]]
name = "ssg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
tiny_http = "0.12"
